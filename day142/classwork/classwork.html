<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roll Simulator</title>
<link rel="stylesheet" href="classwork.css">
</head>
<body>

<div class="app">
    <h1>🎲 Dice Roll Simulator</h1>
    <p class="subtitle">Pick how many dice, then roll</p>

    <div class="dice_row" id="diceRow"></div>

    <div class="controls">
        <div class="dice_count">
            <button id="decreaseBtn">-</button>
            <span id="diceCountLabel">2</span>
            <button id="increaseBtn">+</button>
        </div>
        <button class="roll_btn" id="rollBtn">Roll</button>
    </div>

    <p class="result" id="result">Total: <b>-</b></p>

    <div class="history" id="history"></div>
</div>

<script src="classwork.js"></script>
</body>
</html>
