<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="homework.css">
</head>
<body>
    <div class="deco_l"></div>
    <div class="deco_dots">
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="deco_curve"></div>
 
    <div class="page_wrap">
        <div class="card">
 
            <header>
                <div class="logo">sneakers</div>
                <nav>
                    <ul>
                        <li><a href="#">Collections</a></li>
                        <li><a href="#">Men</a></li>
                        <li><a href="#">Women</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </nav>
                <div class="header_right">
                    <span class="cart_icon">🛒</span>
                    <div class="avatar"></div>
                </div>
            </header>
 
            <div class="product">
 
                <div class="product_media">
                    <div class="main_image"></div>
                    <div class="thumbs">
                        <div class="thumb selected"></div>
                        <div class="thumb"></div>
                        <div class="thumb"></div>
                        <div class="thumb"></div>
                    </div>
                </div>
 
                <div class="product_info">
                    <div class="eyebrow">SNEAKER COMPANY</div>
                    <h1 class="product_title">Fall Limited Edition Sneakers</h1>
                    <p class="product_desc">
                        These low-profile sneakers are your perfect casual wear
                        companion. Featuring a durable rubber outer sole, they'll
                        withstand everything the weather can offer.
                    </p>
 
                    <div class="price_block">
                        <div class="price_row">
                            <span class="price_now">$125.00</span>
                            <span class="discount_badge">50%</span>
                        </div>
                        <span class="price_old">$250.00</span>
                    </div>
 
                    <div class="action_row">
                        <div class="qty_stepper">
                            <button>-</button>
                            <span>0</span>
                            <button>+</button>
                        </div>
                        <button class="add_to_cart">🛒 Add to cart</button>
                    </div>
                </div>
 
            </div>
 
        </div>
    </div>
    
</body>
</html>
