<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>რეგისტრაცია</title>
<link rel="stylesheet" href="homework.css">
</head>
<body>

<div class="auth_card">
    <div class="auth_icon">👤</div>
    <h1>ანგარიშის შექმნა</h1>
    <p class="subtitle">დაარეგისტრირდი და დაიწყე</p>

    <div class="banner" id="banner"></div>

    <form id="registerForm" novalidate>

        <div class="field">
            <label>სახელი</label>
            <input type="text" id="username" placeholder="შენი სახელი">
            <div class="field_error" id="usernameError"></div>
        </div>

        <div class="field">
            <label>ელფოსტა</label>
            <input type="email" id="email" placeholder="you@example.com">
            <div class="field_error" id="emailError"></div>
        </div>

        <div class="field">
            <label>პაროლი</label>
            <div class="input_wrap">
                <input type="password" id="password" placeholder="მინიმუმ 6 სიმბოლო">
                <button type="button" class="toggle_password" data-target="password">👁</button>
            </div>
            <div class="field_error" id="passwordError"></div>
        </div>

        <div class="field">
            <label>გაიმეორე პაროლი</label>
            <div class="input_wrap">
                <input type="password" id="confirmPassword" placeholder="გაიმეორე პაროლი">
                <button type="button" class="toggle_password" data-target="confirmPassword">👁</button>
            </div>
            <div class="field_error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="submit_btn">რეგისტრაცია</button>
    </form>

    <p class="switch_link">უკვე გაქვს ანგარიში? <a href="login.html">შესვლა</a></p>
</div>

<script src="auth.js"></script>
<script src="homework.js"></script>
</body>
</html>
